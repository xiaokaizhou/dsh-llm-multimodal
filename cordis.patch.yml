# dsh-llm-multimodal bundle patch
#
# This plugin owns five global LLM tools — generate_text / _image / _video /
# generate_tts / generate_music — and the `llm-multimodal` settings
# namespace. No host-level config is required: tools discover their models
# from the existing `llm-pi-ai` settings at every call.
- insert:
    - id: llm-multimodal
      name: dsh-llm-multimodal
      config: {}
